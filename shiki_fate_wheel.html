<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Wheel of Fates</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

:root{
  --void: #0a0709;
  --dried-blood: #4a0e0e;
  --blood: #7a1620;
  --candle: #c9a24b;
  --candle-bright: #e8c877;
  --parchment: #ddd0b8;
  --ash: #3a3236;
  --fog: rgba(200,190,180,0.05);
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  padding:0;
  background: radial-gradient(ellipse at 50% 20%, #1a1013 0%, var(--void) 60%, #030202 100%);
  min-height:100vh;
  font-family:'Cormorant Garamond',serif;
  color:var(--parchment);
  overflow-x:hidden;
}

/* drifting fog layers */
.fog{
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    radial-gradient(ellipse at 20% 100%, var(--fog) 0%, transparent 45%),
    radial-gradient(ellipse at 80% 100%, var(--fog) 0%, transparent 45%);
  animation: drift 18s ease-in-out infinite alternate;
  z-index:0;
}
@keyframes drift{
  0%{ transform: translateX(-2%) translateY(0); }
  100%{ transform: translateX(2%) translateY(-1%); }
}

.stage{
  position:relative;
  z-index:1;
  max-width:640px;
  margin:0 auto;
  padding:36px 20px 60px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.site-nav{
  text-align:center;
  font-size:12px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  margin-bottom:20px;
}
.site-nav a{
  color:var(--parchment);
  text-decoration:none;
  opacity:0.6;
}
.site-nav a:hover{ opacity:1; color:var(--candle-bright); }
.site-nav .current{
  color:var(--candle-bright);
  opacity:1;
}
.site-nav .sep{
  color:var(--blood);
  margin:0 10px;
  opacity:0.6;
}

h1{
  font-family:'Cinzel Decorative',serif;
  font-weight:900;
  font-size:clamp(24px,5vw,38px);
  letter-spacing:0.04em;
  color:var(--candle-bright);
  text-align:center;
  margin:6px 0 2px;
  text-shadow: 0 0 18px rgba(201,162,75,0.35), 0 0 2px rgba(0,0,0,0.8);
}
.subtitle{
  text-align:center;
  font-style:italic;
  color:#a89a86;
  font-size:16px;
  margin:0 0 28px;
  letter-spacing:0.02em;
}

/* editable names */
.names-panel{
  width:100%;
  background:linear-gradient(180deg,#140d10,#0d0709);
  border:1px solid var(--dried-blood);
  border-radius:4px;
  padding:16px 18px 18px;
  margin-bottom:28px;
  box-shadow: inset 0 0 24px rgba(122,22,32,0.08);
}
.names-panel-label{
  font-family:'Cinzel Decorative',serif;
  font-size:13px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--candle);
  margin-bottom:10px;
}
#nameList{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:12px;
}
.name-row{
  display:flex;
  gap:8px;
}
.name-row input{
  flex:1;
  background:#150f11;
  border:1px solid #3a2226;
  color:var(--parchment);
  font-family:'Cormorant Garamond',serif;
  font-size:17px;
  padding:8px 10px;
  border-radius:2px;
  outline:none;
}
.name-row input:focus{
  border-color:var(--blood);
  box-shadow: 0 0 6px rgba(122,22,32,0.5);
}
.name-row button{
  background:none;
  border:1px solid #3a2226;
  color:#8a6a6a;
  width:34px;
  border-radius:2px;
  cursor:pointer;
  font-size:16px;
  line-height:1;
}
.name-row button:hover{ color:var(--blood); border-color:var(--blood); }

.panel-actions{
  display:flex;
  gap:10px;
}
.ghost-btn{
  background:none;
  border:1px solid var(--dried-blood);
  color:var(--parchment);
  font-family:'Cormorant Garamond',serif;
  font-size:15px;
  padding:7px 14px;
  border-radius:2px;
  cursor:pointer;
  letter-spacing:0.03em;
}
.ghost-btn:hover{ background:rgba(122,22,32,0.15); border-color:var(--blood); }

/* wheel */
.wheel-wrap{
  position:relative;
  width:min(80vw,380px);
  height:min(80vw,380px);
  margin:10px 0 34px;
}
.wheel-glow{
  position:absolute;
  inset:-30px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(201,162,75,0.18) 0%, transparent 70%);
  filter:blur(6px);
  animation: pulse 3.2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{ opacity:0.55; }
  50%{ opacity:1; }
}
canvas#wheel{
  position:relative;
  border-radius:50%;
  display:block;
  filter: drop-shadow(0 0 22px rgba(0,0,0,0.85));
}
.rim{
  position:absolute;
  inset:0;
  border-radius:50%;
  pointer-events:none;
  background: conic-gradient(from 0deg, #6a5424, var(--candle), #6a5424, #2a1f0d, var(--candle), #6a5424);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 6px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 6px));
  box-shadow: 0 0 0 2px #1a1013, inset 0 0 20px rgba(0,0,0,0.6);
}
.pointer{
  position:absolute;
  top:-22px;
  left:50%;
  transform:translateX(-50%);
  transform-origin:50% 0;
  width:0; height:0;
  border-left:14px solid transparent;
  border-right:14px solid transparent;
  border-top:34px solid var(--blood);
  filter: drop-shadow(0 0 8px rgba(122,22,32,0.9)) drop-shadow(0 2px 2px rgba(0,0,0,0.9));
  z-index:3;
}
@keyframes pinFlick{
  0%{ transform: translateX(-50%) rotate(0deg); }
  25%{ transform: translateX(-50%) rotate(16deg); }
  55%{ transform: translateX(-50%) rotate(-9deg); }
  80%{ transform: translateX(-50%) rotate(4deg); }
  100%{ transform: translateX(-50%) rotate(0deg); }
}
.pointer.flick{
  animation: pinFlick 0.22s ease-out;
}
.pointer::after{
  content:'';
  position:absolute;
  top:-34px; left:-3px;
  width:6px; height:14px;
  background: linear-gradient(var(--blood), var(--dried-blood));
  border-radius:0 0 3px 3px;
  opacity:0.9;
}
.hub{
  position:absolute;
  top:50%; left:50%;
  width:38px; height:38px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background: radial-gradient(circle at 35% 30%, var(--candle-bright), var(--candle) 55%, #4a3510 100%);
  box-shadow: 0 0 14px rgba(201,162,75,0.7), inset 0 0 6px rgba(0,0,0,0.5);
  z-index:2;
  border:1px solid #2a1f0d;
}

.spin-btn{
  font-family:'Cinzel Decorative',serif;
  font-size:16px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  background: linear-gradient(180deg,#5a1017,#3a0a0e);
  color:var(--candle-bright);
  border:1px solid var(--blood);
  padding:14px 38px;
  border-radius:3px;
  cursor:pointer;
  box-shadow: 0 0 18px rgba(122,22,32,0.35), inset 0 0 12px rgba(0,0,0,0.5);
  transition: box-shadow 0.2s, transform 0.1s;
}
.spin-btn:hover{ box-shadow: 0 0 26px rgba(122,22,32,0.6), inset 0 0 12px rgba(0,0,0,0.5); }
.spin-btn:active{ transform: translateY(1px); }
.spin-btn:disabled{ opacity:0.4; cursor:default; }

/* result modal */
.veil{
  position:fixed;
  inset:0;
  background: rgba(4,2,3,0.88);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
  opacity:0;
  pointer-events:none;
  transition: opacity 0.5s ease;
}
.veil.show{ opacity:1; pointer-events:auto; }
.result-card{
  text-align:center;
  padding:38px 44px;
  border:1px solid var(--dried-blood);
  background: linear-gradient(180deg,#160e11,#0a0507);
  box-shadow: 0 0 60px rgba(122,22,32,0.35);
  border-radius:4px;
  transform: scale(0.85);
  transition: transform 0.5s cubic-bezier(.2,1.4,.4,1);
  max-width:80vw;
}
.veil.show .result-card{ transform: scale(1); }
.result-eyebrow{
  font-size:13px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:#8a6a6a;
  margin-bottom:10px;
}
.result-name{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(28px,6vw,42px);
  color:var(--candle-bright);
  text-shadow: 0 0 24px rgba(201,162,75,0.5);
  margin:0 0 18px;
}
.veil button{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  background:none;
  border:none;
  color:var(--parchment);
  text-decoration:underline;
  cursor:pointer;
  font-size:15px;
}

footer{
  color:#5a4a4a;
  font-size:13px;
  font-style:italic;
  margin-top:6px;
}
</style>
</head>
<body>
<div class="fog"></div>

<div class="stage">
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <span class="sep">&middot;</span>
    <span class="current">Wheel of Fates</span>
    <span class="sep">&middot;</span>
    <a href="vampire_countdown.html">Vampire Countdown Clock</a>
  </nav>

  <h1>The Wheel of Fates</h1>
  <p class="subtitle">Spin it, and let the village decide who is chosen.</p>

  <div class="names-panel">
    <div class="names-panel-label">Villagers</div>
    <div id="nameList"></div>
    <div class="panel-actions">
      <button class="ghost-btn" id="addName">+ Add Name</button>
      <button class="ghost-btn" id="applyNames">Redraw Wheel</button>
    </div>
  </div>

  <div class="wheel-wrap">
    <div class="wheel-glow"></div>
    <div class="pointer"></div>
    <canvas id="wheel" width="380" height="380"></canvas>
    <div class="rim"></div>
    <div class="hub"></div>
  </div>

  <button class="spin-btn" id="spinBtn">Spin the Wheel</button>
  <footer>Once it stops, there is no undoing it.</footer>
</div>

<div class="veil" id="veil">
  <div class="result-card">
    <div class="result-eyebrow">The Wheel Has Chosen</div>
    <div class="result-name" id="resultName">&mdash;</div>
    <button id="closeVeil">close the veil</button>
  </div>
</div>

<audio id="spinSound" preload="auto" loop></audio>

const spinSound = document.getElementById('spinSound');
spinSound.src = 'data:audio/mpeg;base64,' + SPIN_SOUND_B64;
const pointerEl = document.querySelector('.pointer');

function flickPin(){
  pointerEl.classList.remove('flick');
  void pointerEl.offsetWidth; // restart animation
  pointerEl.classList.add('flick');
}

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const size = canvas.width;
const center = size/2;
const radius = size/2 - 6;

const palette = ['#5a1017','#241417'];
const seamColor = '#3a0a0e';

let names = ['Villager One','Villager Two','Villager Three','Villager Four'];
let rotation = 0;
let spinning = false;

function renderNameInputs(){
  const list = document.getElementById('nameList');
  list.innerHTML = '';
  names.forEach((n,i)=>{
    const row = document.createElement('div');
    row.className = 'name-row';
    const input = document.createElement('input');
    input.value = n;
    input.placeholder = 'Enter a name';
    input.addEventListener('input', e => { names[i] = e.target.value; });
    const del = document.createElement('button');
    del.textContent = '✕';
    del.addEventListener('click', ()=>{
      if(names.length <= 2) return;
      names.splice(i,1);
      renderNameInputs();
      drawWheel();
    });
    row.appendChild(input);
    row.appendChild(del);
    list.appendChild(row);
  });
}

function drawWheel(){
  ctx.clearRect(0,0,size,size);
  const n = names.length;
  const arc = (Math.PI*2)/n;

  ctx.save();
  ctx.translate(center,center);
  ctx.rotate(rotation);

  for(let i=0;i<n;i++){
    const start = i*arc;
    const end = start+arc;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,radius,start,end);
    ctx.closePath();
    ctx.fillStyle = (n % 2 === 1 && i === n - 1) ? seamColor : palette[i % palette.length];
    ctx.fill();
    ctx.strokeStyle = 'rgba(201,162,75,0.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // label
    ctx.save();
    ctx.rotate(start + arc/2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ddd0b8';
    ctx.font = "600 15px 'Cormorant Garamond', serif";
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = 4;
    const label = names[i] || ('Fate ' + (i+1));
    ctx.fillText(label.length>16 ? label.slice(0,15)+'…' : label, radius-16, 5);
    ctx.restore();
  }

  // faint radial vignette
  const grad = ctx.createRadialGradient(0,0,radius*0.1,0,0,radius);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,'rgba(0,0,0,0.35)');
  ctx.beginPath();
  ctx.arc(0,0,radius,0,Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.restore();
}

function spin(){
  if(spinning || names.filter(n=>n.trim()).length < 2) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;

  const n = names.length;
  const arc = (Math.PI*2)/n;
  const extraTurns = 6 + Math.random()*3; // 6-9 full turns
  const randomOffset = Math.random()*Math.PI*2;
  const targetRotation = rotation + extraTurns*Math.PI*2 + randomOffset;

  const duration = 4200;
  const startRotation = rotation;
  const delta = targetRotation - startRotation;
  const startTime = performance.now();

  try{
    spinSound.currentTime = 0;
    spinSound.volume = 0.7;
    spinSound.playbackRate = 1.15;
    spinSound.play().catch(()=>{});
  }catch(e){}

  let lastTick = Math.floor(startRotation/arc);

  function ease(t){
    return 1 - Math.pow(1-t, 4);
  }

  function frame(now){
    const elapsed = now - startTime;
    const t = Math.min(elapsed/duration, 1);
    rotation = startRotation + delta*ease(t);
    drawWheel();

    const currentTick = Math.floor(rotation/arc);
    if(currentTick !== lastTick){
      lastTick = currentTick;
      flickPin();
    }

    // sound slows and fades as the wheel eases to a stop
    const speedFactor = 1 - t;
    spinSound.playbackRate = Math.max(0.35, 1.15*speedFactor + 0.35);
    spinSound.volume = Math.max(0, 0.7*speedFactor);

    if(t < 1){
      requestAnimationFrame(frame);
    }else{
      spinSound.pause();
      finishSpin();
    }
  }
  requestAnimationFrame(frame);
}

function finishSpin(){
  spinning = false;
  document.getElementById('spinBtn').disabled = false;

  const n = names.length;
  const arc = (Math.PI*2)/n;
  // pointer sits at top (-90deg / -PI/2 from canvas 0deg which starts at 3 o'clock)
  const normalized = ((rotation % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  const pointerAngle = ( (3*Math.PI/2) - normalized + Math.PI*2*10 ) % (Math.PI*2);
  const index = Math.floor(pointerAngle / arc) % n;

  const winner = names[index] || ('Fate ' + (index+1));
  document.getElementById('resultName').textContent = winner;
  document.getElementById('veil').classList.add('show');
}

document.getElementById('addName').addEventListener('click', ()=>{
  if(names.length >= 8) return;
  names.push('');
  renderNameInputs();
});
document.getElementById('applyNames').addEventListener('click', ()=>{
  drawWheel();
});
document.getElementById('spinBtn').addEventListener('click', spin);
